name: Secure CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Static Code Analysis (SAST)
  # ─────────────────────────────────────────────
  sast-sonarqube:
    name: SAST – SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarQube branch analysis

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd app
          npm ci

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=secure-pipeline
            -Dsonar.sources=app
            -Dsonar.qualitygate.wait=true

  # ─────────────────────────────────────────────
  # JOB 2: Build Docker Image
  # ─────────────────────────────────────────────
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: sast-sonarqube  # Only builds if SAST passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t secure-app:${{ github.sha }} ./app

      - name: Save Docker image as artifact
        run: |
          docker save secure-app:${{ github.sha }} -o secure-app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: secure-app.tar
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 3: Container Vulnerability Scan (Trivy)
  # ─────────────────────────────────────────────
  trivy-scan:
    name: Container Scan – Trivy
    runs-on: ubuntu-latest
    needs: docker-build  # Only scans after image is built

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i secure-app.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-app:${{ github.sha }}
          format: table
          exit-code: '1'              # Fail pipeline if vulnerabilities found
          severity: 'CRITICAL,HIGH'   # Only fail on CRITICAL and HIGH CVEs
          ignore-unfixed: true        # Ignore CVEs with no available fix
          trivyignores: .trivyignore  # Respect documented exceptions

      - name: Run Trivy – Generate SARIF report
        uses: aquasecurity/trivy-action@master
        if: always()  # Always generate report even if scan fails
        with:
          image-ref: secure-app:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ─────────────────────────────────────────────
  # JOB 4: Deploy (only if all gates pass)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy – All Gates Passed
    runs-on: ubuntu-latest
    needs: [sast-sonarqube, docker-build, trivy-scan]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i secure-app.tar

      - name: Simulate Deployment
        run: |
          echo "✅ All security gates passed."
          echo "🚀 Deploying secure-app:${{ github.sha }} to environment..."
          echo "Pipeline: SAST ✅ | Docker Build ✅ | Trivy Scan ✅ | Deploy ✅"
          # Replace this step with actual deployment commands:
          # e.g., kubectl apply, AWS ECS deploy, etc.
